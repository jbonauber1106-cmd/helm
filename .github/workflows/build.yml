name: Build Helm VST3 (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      # Corner roundness in pixels for buttons/selectors (containers use double). 0 = square corners.
      UI_RADIUS: "3.0"
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Apply the patches
        shell: bash
        run: |
          git apply --whitespace=nowarn helm-randomizer.patch
          git apply --whitespace=nowarn helm-ui-rounded.patch
          sed -i "s/#define HELM_UI_RADIUS .*/#define HELM_UI_RADIUS ((float)${UI_RADIUS})/" src/look_and_feel/ui_style.h
          grep -n "HELM_UI_RADIUS" src/look_and_feel/ui_style.h
          git diff --stat

      - name: Make the VST3 default to stereo output
        shell: bash
        run: |
          sed -i 's/{0, 1}, {0, 2}/{0, 2}, {0, 1}/' JuceLibraryCode/AppConfig.h
          grep -n "PreferredChannelConfigurations  " JuceLibraryCode/AppConfig.h

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Helm engine library (Shared Code)
        shell: pwsh
        run: |
          $sln = "$PWD\builds\vs17\"
          msbuild builds\vs17\Helm_SharedCode.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:SolutionDir=$sln `
            /m /nologo /v:m
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse builds\vs17 -Filter *.lib | ForEach-Object { $_.FullName }

      - name: Build VST3 (64-bit, Release)
        shell: pwsh
        run: |
          $sln = "$PWD\builds\vs17\"
          msbuild builds\vs17\Helm_VST3.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:SolutionDir=$sln `
            /m /nologo /v:m

      - name: Collect the plugin
        shell: pwsh
        run: |
          Get-ChildItem -Recurse builds\vs17 -Filter *.vst3 | ForEach-Object { $_.FullName }
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem -Recurse builds\vs17 -Filter helm.vst3 | Select-Object -First 1 | Copy-Item -Destination out\helm.vst3

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: Helm-Randomizer-VST3-Windows
          path: out/helm.vst3
          if-no-files-found: error
